org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# Clé API TMDB (The Movie Database) - utilisée pour récupérer affiches/résumés
# des films et séries en complément des playlists M3U.
# ⚠️ Ne mets JAMAIS la vraie clé ici (dépôt public) : elle est injectée par le
# workflow GitHub Actions depuis le secret TMDB_API_KEY. Pour un build local,
# ajoute-la dans ~/.gradle/gradle.properties ou passe -PTMDB_API_KEY=xxx.
# N'importe qui avec cette clé pourrait consommer ton quota TMDB.
TMDB_API_KEY=
